<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="60" y="58" font-size="34" font-weight="700" fill="#1f2933">Talking to the MCP server directly</text>
  <text x="60" y="94" font-size="19" fill="#667085">Advanced 7 &#183; an offline agent, a browser guard that is not auth, a hidden unlock tool</text>

  <!-- LEFT: ATTACK CHAIN -->
  <rect x="40" y="125" width="900" height="700" rx="16" fill="#fafbfc" stroke="#e3e8ee" stroke-width="2"/>
  <text x="64" y="168" font-size="20" font-weight="700" fill="#1f2933">ATTACK CHAIN</text>
  <text x="916" y="168" text-anchor="end" font-size="16" fill="#667085">no tools in the UI &#8594; flag read</text>

  <rect x="64" y="190" width="852" height="96" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="1.5"/>
  <circle cx="112" cy="238" r="26" fill="#eef2f7" stroke="#2563a0" stroke-width="2"/>
  <text x="112" y="247" text-anchor="middle" font-size="24" font-weight="700" fill="#2563a0">1</text>
  <text x="160" y="230" font-size="20" font-weight="600" fill="#1f2933">Agent discloses the endpoint</text>
  <text x="160" y="260" font-size="15.5" fill="#667085">Tools show as offline, and the agent names its server: /level/7/mcp.</text>

  <line x1="112" y1="286" x2="112" y2="314" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="112,324 106,312 118,312" fill="#c0392b"/>

  <rect x="64" y="326" width="852" height="120" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="1.5"/>
  <circle cx="112" cy="386" r="26" fill="#eef2f7" stroke="#2563a0" stroke-width="2"/>
  <text x="112" y="395" text-anchor="middle" font-size="24" font-weight="700" fill="#2563a0">2</text>
  <text x="160" y="370" font-size="20" font-weight="600" fill="#1f2933">Browser guard is not authentication</text>
  <text x="160" y="400" font-size="15.5" fill="#667085">Browser POST &#8594; 403 Invalid Origin (DNS-rebinding protection).</text>
  <text x="160" y="423" font-size="15.5" fill="#667085">curl with the session cookie and no Origin completes the handshake.</text>

  <line x1="112" y1="446" x2="112" y2="474" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="112,484 106,472 118,472" fill="#c0392b"/>

  <rect x="64" y="486" width="852" height="120" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="1.5"/>
  <circle cx="112" cy="546" r="26" fill="#eef2f7" stroke="#2563a0" stroke-width="2"/>
  <text x="112" y="555" text-anchor="middle" font-size="24" font-weight="700" fill="#2563a0">3</text>
  <text x="160" y="530" font-size="20" font-weight="600" fill="#1f2933">Enumerate what the UI hid</text>
  <text x="160" y="560" font-size="15.5" fill="#667085">resources/list &#8594; resource://flag. tools/list &#8594; unlock_flag,</text>
  <text x="160" y="583" font-size="15.5" fill="#667085">a tool the agent interface never displayed.</text>

  <line x1="112" y1="606" x2="112" y2="634" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="112,644 106,632 118,632" fill="#c0392b"/>

  <rect x="64" y="646" width="852" height="96" rx="10" fill="#fff9f9" stroke="#e6b8b3" stroke-width="1.5"/>
  <circle cx="112" cy="694" r="26" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="112" y="703" text-anchor="middle" font-size="24" font-weight="700" fill="#b02a2a">4</text>
  <text x="160" y="686" font-size="20" font-weight="600" fill="#1f2933">Unlock and read</text>
  <text x="160" y="716" font-size="15.5" fill="#b02a2a" font-weight="600">flag was locked &#8594; unlock_flag {} &#8594; resources/read resource://flag &#8594; flag.</text>

  <text x="64" y="784" font-size="15" fill="#667085">The lock was real, enforced by call order only. unlock_flag takes no argument and checks no caller</text>
  <text x="64" y="808" font-size="15" fill="#667085">identity, so anyone who speaks the protocol can call it.</text>

  <!-- RIGHT: MECHANISM -->
  <rect x="960" y="125" width="600" height="700" rx="16" fill="#fafbfc" stroke="#e3e8ee" stroke-width="2"/>
  <text x="984" y="168" font-size="20" font-weight="700" fill="#1f2933">WHAT THE SERVER TRUSTED</text>

  <rect x="984" y="192" width="552" height="128" rx="10" fill="#ffffff" stroke="#e6b8b3" stroke-width="1.5"/>
  <text x="1008" y="228" font-size="18" font-weight="700" fill="#b02a2a">Hiding a tool is not access control</text>
  <text x="1008" y="256" font-size="15.5" fill="#667085">The agent UI omitted unlock_flag, but the</text>
  <text x="1008" y="277" font-size="15.5" fill="#667085">server still served it to tools/list and</text>
  <text x="1008" y="298" font-size="15.5" fill="#667085">tools/call (CWE-602).</text>

  <rect x="984" y="336" width="552" height="128" rx="10" fill="#ffffff" stroke="#e6b8b3" stroke-width="1.5"/>
  <text x="1008" y="372" font-size="18" font-weight="700" fill="#b02a2a">No authz on a privileged tool</text>
  <text x="1008" y="400" font-size="15.5" fill="#667085">unlock_flag is state-changing, takes no</text>
  <text x="1008" y="421" font-size="15.5" fill="#667085">argument, and checks no caller identity</text>
  <text x="1008" y="442" font-size="15.5" fill="#667085">(CWE-862).</text>

  <rect x="984" y="480" width="552" height="128" rx="10" fill="#ffffff" stroke="#e3e8ee" stroke-width="1.5"/>
  <text x="1008" y="516" font-size="18" font-weight="700" fill="#1f2933">Origin check did its job</text>
  <text x="1008" y="544" font-size="15.5" fill="#667085">It stops a malicious website from driving a</text>
  <text x="1008" y="565" font-size="15.5" fill="#667085">victim's browser. It is not authentication, and</text>
  <text x="1008" y="586" font-size="15.5" fill="#667085">the server had no other control.</text>

  <rect x="984" y="624" width="552" height="166" rx="10" fill="#eaf6ee" stroke="#3f9d5a" stroke-width="1.5"/>
  <text x="1008" y="660" font-size="17" font-weight="700" fill="#2f7d47">The fix</text>
  <text x="1008" y="688" font-size="15" fill="#3a6b49">Authenticate and authorize at the MCP server:</text>
  <text x="1008" y="709" font-size="15" fill="#3a6b49">OAuth per the spec, per-tool and per-resource</text>
  <text x="1008" y="730" font-size="15" fill="#3a6b49">scopes. Keep the resource server off any route a</text>
  <text x="1008" y="751" font-size="15" fill="#3a6b49">user can reach. Enforce the lock on identity,</text>
  <text x="1008" y="772" font-size="15" fill="#3a6b49">not on call order.</text>

  <text x="60" y="866" font-size="14" fill="#98a2b3">github.com/le0n3das/ai-agent-attacks</text>
</svg>
